    <script>
      // Set <base> at runtime so one build works on both bolt.host (served at /)
      // and GitHub Pages (served at /homework-dashboard/).
      (function() {
        var path = window.location.pathname;
        var base;
        if (path.indexOf('/homework-dashboard/') === 0 || path === '/homework-dashboard') {
          base = '/homework-dashboard/';
        } else {
          base = '/';
        }
        var el = document.createElement('base');
        el.href = base;
        document.head.appendChild(el);
      })();
    </script>
</head>
  <body>
    <script>
      (function() {
        var stored = localStorage.getItem('theme');
        if (!stored || stored === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
